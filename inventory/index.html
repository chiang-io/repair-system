<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16354d">
<title>庫存查詢</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#e9edf0; --surface:#ffffff; --sunk:#f3f5f7; --ink:#14212b; --muted:#5a6a76; --line:#cfd7dd;
  --accent:#f2a900; --accent-ink:#1a1400; --steel:#1f5f8b; --good:#1d7a4c; --warn:#a85b00; --bad:#b3261e;
  --hl:#fff1c2; --bar:#16354d; --bar-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#16212a; --sunk:#111b22; --ink:#e2e9ee; --muted:#8fa0ad; --line:#2a3a46;
  --accent:#f5b81f; --accent-ink:#1a1400; --steel:#6fa8d6; --good:#4fc48a; --warn:#f0a040; --bad:#f2786f;
  --hl:#3d3418; --bar:#0b1d2a; --bar-ink:#e2e9ee; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16212a; --sunk:#111b22; --ink:#e2e9ee; --muted:#8fa0ad; --line:#2a3a46;
  --accent:#f5b81f; --accent-ink:#1a1400; --steel:#6fa8d6; --good:#4fc48a; --warn:#f0a040; --bad:#f2786f;
  --hl:#3d3418; --bar:#0b1d2a; --bar-ink:#e2e9ee; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
header{background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.04em}
header .date{margin-left:auto;font-size:13px;opacity:.85;text-align:right;line-height:1.3}
header .date b{display:block;font-size:14px;opacity:1}

/* sticky search area */
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:52px;border:2px solid var(--line);border-radius:12px;background:var(--surface);
  padding:0 14px;font-size:18px}
.search input:focus{outline:none;border-color:var(--steel)}
.search .clear{width:52px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:20px}
.search .cam{font-size:22px}
.scan{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scan .txt{flex:1;min-width:0;word-break:break-all}
.likely{font-size:12px;color:var(--steel);font-weight:700;margin-bottom:2px}
.cchip{display:inline-flex;align-items:center}
.cchip .chip{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none}
.cchip .cdel{border:1.5px solid var(--line);border-left:none;background:var(--surface);color:var(--muted);border-radius:0 999px 999px 0;padding:5px 10px 5px 6px;font-size:14px;line-height:1.3}
.cchip .chip[aria-pressed="true"]+.cdel{background:var(--steel);border-color:var(--steel);color:#fff}
#camDlg form{padding:12px}
#camCv{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;touch-action:none;border-radius:10px;background:#000}
#camDlg .hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff}
.chip.clear{border-color:var(--bad);color:var(--bad);background:transparent;font-weight:500}
.allnote{align-self:center;color:var(--muted);font-size:13px;padding:0 4px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;border:none;border-radius:10px;padding:9px 4px;background:var(--sunk);font-weight:500;font-size:15px;white-space:nowrap;min-width:0}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* banners */
.banner{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{border-color:var(--warn);background:var(--hl)}
.banner.bad{border-color:var(--bad)}
.banner b{font-weight:700}

/* result cards */
.meta{color:var(--muted);font-size:13px;margin:10px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card .name{font-size:17px;font-weight:700;line-height:1.35;word-break:break-word}
.card .code{display:flex;align-items:center;gap:8px;margin-top:2px;color:var(--steel);font-size:15px;font-weight:600;word-break:break-all}
.card .wt{color:var(--muted);font-size:13px;flex:1}
.stock{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.srow{display:flex;align-items:center;gap:10px;padding:5px 0}
.wh{font-size:14px;min-width:0;flex:1}
.wh .no{display:inline-block;min-width:30px;text-align:center;border-radius:6px;background:var(--sunk);padding:0 6px;margin-right:6px;font-weight:700}
.wh.main .no{background:var(--steel);color:#fff}
.qty{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty.neg{color:var(--bad)}
.qty.zero{color:var(--muted)}
.qty small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.add{border:1.5px solid var(--steel);color:var(--steel);background:transparent;border-radius:8px;padding:3px 10px;font-size:14px;white-space:nowrap}
.add.on{background:var(--good);border-color:var(--good);color:#fff}
.negnote{font-size:12px;color:var(--bad)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.more{width:100%;border:1.5px dashed var(--steel);background:transparent;color:var(--steel);border-radius:12px;padding:10px;margin:6px 0 10px;font-size:15px}

/* pick list */
.pick{display:flex;gap:10px;align-items:flex-start}
.pick input[type=checkbox]{width:26px;height:26px;margin-top:2px;flex:none;accent-color:var(--good)}
.pick .body{flex:1;min-width:0}
.pick.done .name{text-decoration:line-through;color:var(--muted)}
.pick .del{border:none;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.pick .qtyline{font-size:16px;margin-top:4px}
.pick .qtyline b{font-size:20px}
.cgroup{margin:14px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cgroup h3{margin:0;font-size:17px;flex:1;min-width:0;word-break:break-all}
.cgroup .small{padding:5px 10px;font-size:13px}
.pedit{border:none;background:none;padding:2px 6px;font-size:15px;cursor:pointer}
#mainView.counting .sticky .search,#mainView.counting #chips{display:none}
#mainView.counting .tabs{margin-top:0}
.crow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
.crow.ok{border-left-color:var(--good)} .crow.bad{border-left-color:var(--bad)}
.crow .cn{flex:1;min-width:0} .crow .cn .nm{font-weight:700;font-size:15px;line-height:1.35;word-break:break-word}
.crow .cn .cd{font-size:13px;color:var(--steel)}
.crow .cq{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.crow .cq b{font-size:18px;color:var(--ink)}
.prog{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--good)}
#countQ{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px;margin:8px 0 2px}
.pprog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:4px 0 2px;max-width:220px}
.pprog i{display:block;height:100%;background:var(--good)}
.cntnote{font-size:13px;color:var(--steel);margin:-2px 0 4px 36px}
.picknote{font-size:13px;color:var(--steel);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{border:none;border-radius:10px;padding:10px 16px;background:var(--steel);color:#fff;font-weight:500}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* empty / import */
.empty{text-align:center;padding:28px 8px}
.empty h2{font-size:20px;margin:6px 0 8px}
.empty p{color:var(--muted);margin:6px 0}
.steps{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px 12px 34px;margin:16px auto;max-width:460px}
.steps li{margin:4px 0}
.big{font-size:18px;padding:14px 22px;border-radius:12px}
footer{color:var(--muted);font-size:13px;padding:20px 0 32px;border-top:1px solid var(--line);margin-top:24px}
footer a{color:var(--steel)}
footer .row{margin:8px 0}
footer .row.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* 數量回報 */
.srow .rep{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:2px 8px;font-size:13px;white-space:nowrap}
.repnote{font-size:13px;color:var(--warn);margin:-2px 0 4px 36px}
.repnote.ok{color:var(--good)}
.rcard .check{font-size:14px;margin-top:6px;padding:6px 10px;border-radius:8px;background:var(--sunk)}
.rcard .check.fixed{color:var(--good);font-weight:700}
.rcard .check.still{color:var(--warn)}
.rcard .check.gone{color:var(--muted)}
.diff{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.diff.d-less{color:var(--bad)} .diff.d-more{color:var(--warn)}
.rcard .line{font-size:15px;margin-top:4px}
.rcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
dialog{border:none;border-radius:16px;padding:0;width:min(520px,calc(100% - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h3{margin:0 0 2px;font-size:17px;line-height:1.35}
dialog .sys{background:var(--sunk);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:15px}
dialog label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
dialog input[type=number],dialog input[type=text]{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 12px;font-size:18px}
dialog input:focus{outline:none;border-color:var(--steel)}
dialog .chips{margin-top:0}
dialog .live{font-size:14px;margin-top:6px;min-height:1.5em}
dialog .btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast button{margin-left:10px;border:none;background:none;color:var(--accent);font-weight:700;padding:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>庫存查詢</h1>
  <div class="date" id="dateBox" hidden></div>
</div></header>

<main class="wrap">
  <section id="emptyView" class="empty" hidden>
    <div id="stLoading"><h2>讀取資料中…</h2></div>
    <div id="stNone" hidden>
      <h2>還沒有庫存資料</h2>
      <p>請用<b>電腦</b>打開上傳頁面，上傳 ERP 的庫存報表：</p>
      <p class="mono" style="word-break:break-all"><a id="uploadLink" href="upload.html">upload.html</a></p>
      <p>上傳後大約 1～2 分鐘，這裡就會自動出現。</p>
      <button class="btn" data-sync>重新檢查</button>
    </div>
    <div id="stOffline" hidden>
      <h2>連不上網路</h2>
      <p>第一次使用要有網路，才能下載庫存資料。之後沒網路也能查。</p>
      <button class="btn" data-sync>再試一次</button>
    </div>
  </section>

  <form id="passBox" class="banner" hidden>
    <b id="passTitle">輸入公司密碼</b>
    <p id="passMsg" style="margin:4px 0 10px">庫存資料有加密。這支手機只要輸入一次，之後會記住。</p>
    <div class="search">
      <input id="passInput" type="password" autocomplete="current-password" placeholder="密碼" required>
      <button class="btn primary" type="submit" style="padding:0 18px">確定</button>
    </div>
  </form>

  <section id="mainView" hidden>
    <div class="sticky">
      <div class="search">
        <input id="q" type="text" inputmode="search" autocomplete="off" enterkeyhint="search"
          placeholder="打品名或編號，例如：斜桿 1.8">
        <button class="clear cam" id="camBtn" aria-label="拍照或從相簿選照片找品名" title="拍照或從相簿選標示卡照片找品名">📷</button>
        <button class="clear" id="clearQ" aria-label="清除">×</button>
        <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
        <input type="file" id="albumFile" accept="image/*" hidden>
      </div>
      <div class="chips" id="chips"></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabSearch" aria-selected="true">查詢</button>
        <button class="tab" role="tab" id="tabPick" aria-selected="false">備料清單 <span id="pickCount"></span></button>
        <button class="tab" role="tab" id="tabRep" aria-selected="false">回報 <span id="repCount"></span></button>
        <button class="tab" role="tab" id="tabCount" aria-selected="false">盤點</button>
      </div>
    </div>
    <div id="staleBox"></div>
    <div id="searchView"></div>
    <div id="pickView" hidden></div>
    <div id="repView" hidden></div>
    <div id="countView" hidden>
      <p class="meta" style="margin-bottom:4px">選要盤的倉，點品項輸入現場點到的數量。大家一起盤，進度都看得到。</p>
      <div class="chips" id="countWhs"></div>
      <div id="countProg"></div>
      <div class="chips" id="countFilters"></div>
      <input id="countQ" type="text" inputmode="search" autocomplete="off" placeholder="在這個倉裡找品名或編號">
      <div id="countList"></div>
      <div class="actions">
        <button class="btn ghost" id="countReload">重新整理</button>
      </div>
    </div>
  </section>

  <footer>
    <div class="row btns" id="footSync">
      <button class="btn ghost" data-sync>檢查有沒有新資料</button>
      <span id="fileInfo"></span>
    </div>
    <div class="row">數量來自電腦上傳的 ERP 報表，<b>不是即時庫存</b>。負數表示帳上數量不對，請以現場為準。</div>
    <div class="row">新的報表請用電腦上傳：<a href="upload.html">上傳頁面</a></div>
    <div class="row"><a href="../">← 貨櫃裝箱模擬</a></div>
  </footer>
</main>
<div class="toast" id="toast" hidden></div>
<dialog id="srcDlg">
  <form method="dialog" style="padding:16px;display:grid;gap:10px">
    <h3 style="margin:0 0 4px">用照片找品名</h3>
    <button class="btn primary" type="button" id="srcCam" style="font-size:18px;padding:14px">📷　拍照</button>
    <button class="btn" type="button" id="srcAlbum" style="font-size:18px;padding:14px">🖼️　從相簿選照片</button>
    <button class="btn ghost" type="submit">取消</button>
  </form>
</dialog>
<dialog id="camDlg">
  <form method="dialog" id="camForm">
    <canvas id="camCv"></canvas>
    <p class="hint">用手指在<b>品名</b>周圍畫一個框，會比較準；不畫就辨識整張。</p>
    <div class="btnrow">
      <button class="btn ghost" type="button" id="camRetake">換一張</button>
      <button class="btn ghost" type="button" id="camCancel">取消</button>
      <button class="btn primary" type="submit">辨識</button>
    </div>
  </form>
</dialog>
<dialog id="pickDlg">
  <form method="dialog" id="pickForm">
    <h3 id="pickName"></h3>
    <div class="mono" style="color:var(--steel);font-size:14px" id="pickCode"></div>
    <div class="sys" id="pickStock"></div>
    <label class="f" for="pickQty">已經備好幾支／個</label>
    <input id="pickQty" type="number" inputmode="numeric" step="any" min="0" required placeholder="數量">
    <label class="f" for="pickCust">給哪個客戶（選填）</label>
    <input id="pickCust" type="text" list="custList" autocomplete="off" placeholder="客戶名稱">
    <datalist id="custList"></datalist>
    <div class="chips" id="custChips" style="margin-top:8px"></div>
    <div class="live" id="pickLive"></div>
    <div class="btnrow">
      <button class="btn ghost" type="button" id="pickCancel">取消</button>
      <button class="btn primary" type="submit">加入</button>
    </div>
  </form>
</dialog>
<dialog id="countDlg">
  <form method="dialog" id="countForm">
    <h3 id="cdName"></h3>
    <div class="mono" style="color:var(--steel);font-size:14px" id="cdCode"></div>
    <div class="sys" id="cdSys"></div>
    <label class="f" for="cdQty">地上（架上、地上點到的）</label>
    <input id="cdQty" type="number" inputmode="decimal" step="any" min="0" placeholder="點到幾個？">
    <label class="f" for="cdPrep">已備貨（為出貨先備好、放旁邊的）</label>
    <input id="cdPrep" type="number" inputmode="decimal" step="any" min="0" placeholder="沒有就空著">
    <div class="meta" id="cdPrepHint" style="margin:4px 0 0"></div>
    <div class="live" id="cdLive"></div>
    <div class="btnrow" style="flex-wrap:wrap">
      <button class="btn ghost" type="button" id="cdClear" style="margin-right:auto">清除這筆</button>
      <button class="btn ghost" type="button" id="cdCancel">取消</button>
      <button class="btn" type="button" id="cdSave">儲存</button>
      <button class="btn primary" type="submit">儲存，下一項</button>
    </div>
  </form>
</dialog>
<dialog id="repDlg">
  <form method="dialog" id="repForm">
    <h3 id="repName"></h3>
    <div class="mono" style="color:var(--steel);font-size:14px" id="repCode"></div>
    <div class="sys" id="repSys"></div>
    <label class="f" for="repQty">現場實際數量</label>
    <input id="repQty" type="number" inputmode="numeric" step="any" required placeholder="點到幾個？">
    <div class="live" id="repLive"></div>
    <label class="f">可能原因</label>
    <div class="chips" id="repReason"></div>
    <label class="f" for="repNote">備註（選填）</label>
    <input id="repNote" type="text" placeholder="例如：A 區架上只有 3 包">
    <div class="btnrow">
      <button class="btn ghost" type="button" id="repCancel">取消</button>
      <button class="btn primary" type="submit">送出</button>
    </div>
  </form>
</dialog>

<script src="common.js?v=6"></script>
<script src="config.js?v=6"></script>
<script>
'use strict';
const MAIN_WH = ['02', '06'];          // 倉管常用：02 新品倉、06 五金倉（第一次打開預設選這兩個）
const WH_ORDER = ['01', '02', '03', '06', '04'];   // 倉別按鈕與卡片裡的排列順序；其他倉排在後面
const whRank = w => { const i = WH_ORDER.indexOf(w); return i < 0 ? WH_ORDER.length : i; };
const whCmp = (a, b) => (whRank(a) - whRank(b)) || a.localeCompare(b);
const PAGE = 60;                        // 一次顯示幾張卡片
const $ = id => document.getElementById(id);

/* ---------- 儲存（只在這個瀏覽器） ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};

let index = null;

/* ---------- 模糊搜尋：拍照或手打的字不完全一樣時，找「最像」的品項 ---------- */
const CJK_RE = /[㐀-鿿]/g;
function fuzzyPrep(s) {
  const n = norm(s);
  return {
    cjk: new Set(n.match(CJK_RE) || []),
    nums: new Set(n.match(/\d+(?:\.\d+)?/g) || []),
    models: new Set(n.replace(/-/g, '').match(/[a-z]+\d+[a-z]*/g) || []),   // 型號，例如 CN-90 → cn90
  };
}
// 辨識常把 φ 認成 6 或 @，所以「648.6」也算對到「48.6」
function numHit(qnums, h) {
  if (qnums.has(h)) return true;
  for (const q of qnums) if (h.length >= 2 && q.length > h.length && q.endsWith(h)) return true;
  return false;
}
const dice = (hit, a, b) => (a + b) ? 2 * hit / (a + b) : 0;
function fuzzyScore(q, g) {
  const f = g.fz || (g.fz = fuzzyPrep(g.name));
  let c = 0; f.cjk.forEach(x => { if (q.cjk.has(x)) c++; });
  let n = 0; f.nums.forEach(x => { if (numHit(q.nums, x)) n++; });
  let m = 0; f.models.forEach(x => { if (q.models.has(x)) m++; });
  const model = f.models.size || q.models.size ? dice(m, q.models.size, f.models.size) : 0.5;
  return dice(c, q.cjk.size, f.cjk.size) * 0.45 + dice(n, q.nums.size, f.nums.size) * 0.3 + model * 0.25;
}
function fuzzyFind(raw) {
  const qp = fuzzyPrep(raw);
  const scored = index.groups.map(g => ({ g, s: fuzzyScore(qp, g) })).filter(x => x.s >= 0.3).sort((a, b) => b.s - a.s);
  const best = scored.length ? scored[0].s : 0;
  return scored.filter(x => x.s >= best * 0.7).slice(0, 12).map(x => x.g);
}

const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const TESS_OPT = {

  corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',

async function getOcr() {

// 只取框起來的部分，縮小到約 700px（字太大反而認不出來）、轉灰階、拉高對比、四周留白
function prepImage(img, box) {
  const b = box || { x: 0, y: 0, w: img.width, h: img.height };
  const k = Math.min(1, 700 / Math.max(b.w, b.h)), pad = 30;
  const w = Math.round(b.w * k), h = Math.round(b.h * k);
  const c = document.createElement('canvas'); c.width = w + pad * 2; c.height = h + pad * 2;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, b.x, b.y, b.w, b.h, pad, pad, w, h);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const v = Math.min(255, Math.max(0, (0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2] - 128) * 1.6 + 128));
    p[i] = p[i + 1] = p[i + 2] = v;
  }
  x.putImageData(d, 0, 0);
  return c;
}

let camImg = null, camBox = null;
function drawCam() {
  const cv = $('camCv'), x = cv.getContext('2d');
  x.drawImage(camImg, 0, 0, cv.width, cv.height);
  if (camBox) {
    const k = cv.width / camImg.width, r = { x: camBox.x * k, y: camBox.y * k, w: camBox.w * k, h: camBox.h * k };
    x.fillStyle = 'rgba(0,0,0,.55)';
    x.fillRect(0, 0, cv.width, r.y); x.fillRect(0, r.y + r.h, cv.width, cv.height - r.y - r.h);
    x.fillRect(0, r.y, r.x, r.h); x.fillRect(r.x + r.w, r.y, cv.width - r.x - r.w, r.h);
    x.strokeStyle = '#f5b81f'; x.lineWidth = Math.max(3, cv.width / 150); x.strokeRect(r.x, r.y, r.w, r.h);
  }
}
(() => {
  const cv = $('camCv'); let start = null;
  const pos = e => { const r = cv.getBoundingClientRect(), k = camImg.width / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k }; };
  cv.addEventListener('pointerdown', e => { if (!camImg) return; cv.setPointerCapture(e.pointerId); start = pos(e); camBox = null; drawCam(); });
  cv.addEventListener('pointermove', e => {
    if (!start) return; const p = pos(e);
    camBox = { x: Math.max(0, Math.min(start.x, p.x)), y: Math.max(0, Math.min(start.y, p.y)), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
    drawCam();
  });
  const end = () => { start = null; if (camBox && (camBox.w < 30 || camBox.h < 15)) { camBox = null; drawCam(); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
})();

async function repApi(body) {

async function tApi(action, table, extra) {

    .sort((a, b) => String(a['時間']).localeCompare(String(b['時間']))).pop() || null;

function diffHtml(r) {

}
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

const ymd = v => { const d = new Date(v); return isNaN(d) ? String(v || '').slice(0, 10) : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function repCheck(r) {
  const g = index && index.groups.find(x => x.code === r.code);
  const st = g && g.stock.find(s => s.wh === r.wh);
  const newer = !!data && !!r.dataDate && ymd(r.dataDate) < data.date;
  if (!st) return newer ? { kind: 'gone', text: `${data.date} 的新報表裡沒有這個品項` } : null;
  if (st.qty === r.sys && !newer) return null;                       // 還是同一份報表
  if (st.qty === r.actual) return { kind: 'fixed', text: `✅ 新報表已經是 ${fmt(st.qty)}，帳可能已修正，可以劃掉了` };
  return { kind: 'still', text: `新報表 ${fmt(st.qty)}，還是不對（跟實際${st.qty > r.actual ? '多' : '少'} ${fmt(Math.abs(st.qty - r.actual))}）` };

  $('countWhs').innerHTML = whs.map(w => `<button class="chip" data-cw="${esc(w)}" aria-pressed="${w === countWh}">${esc(w)} ${esc(whLabel(w))}${nByWh[w] ? `<b style="margin-left:4px">（${nByWh[w]}）</b>` : ''}</button>`).join('');
  $('countWhs').querySelectorAll('[data-cw]').forEach(b => b.onclick = () => { countWh = b.dataset.cw; store.set('inv-count-wh', countWh); countShown = 80; renderCount(); });
  if (!countsOk) {
    $('countProg').innerHTML = `<div class="banner warn"><b>Google 那邊的程式還沒更新。</b>請照說明在 Apps Script 貼上新程式並重新部署，盤點才能用。</div>`;
    $('countList').innerHTML = ''; $('countFilters').innerHTML = ''; return;
  }
  const items = countItems();
  const done = items.filter(x => x.c).length, diff = items.filter(x => x.c && x.c.actual !== x.st.qty).length;
  $('countProg').innerHTML = `<div class="prog"><i style="width:${items.length ? done / items.length * 100 : 0}%"></i></div>
    <div class="meta" style="margin:2px 0 6px">已盤 <b>${done}</b> / ${items.length} 項${diff ? `，<b style="color:var(--bad)">${diff} 項有差異</b>` : ''}${repState.loading ? '・更新中…' : ''}</div>`;
  $('countFilters').innerHTML = COUNT_FILTERS.map(([k, t]) => `<button class="chip" data-cf="${k}" aria-pressed="${k === countFilter}">${t}</button>`).join('');
  $('countFilters').querySelectorAll('[data-cf]').forEach(b => b.onclick = () => { countFilter = b.dataset.cf; countShown = 80; renderCount(); });
  const vis = countVisible(items);
  $('countList').innerHTML = (vis.length ? '' : `<div class="banner">${countFilter === 'todo' && done === items.length ? '這個倉都盤完了 🎉' : '沒有符合的品項。'}</div>`) +
    vis.slice(0, countShown).map(x => {
      const st = !x.c ? '' : x.c.actual === x.st.qty ? 'ok' : 'bad';
      return `<button class="crow ${st}" data-cc="${esc(x.g.code)}">
        <div class="cn"><div class="nm">${esc(x.g.name)}</div><div class="cd mono">${esc(x.g.code)}</div></div>
        <div class="cq">系統 ${fmt(x.st.qty)}<br>${x.c ? `實盤 <b>${fmt(x.c.actual)}</b>${st === 'bad' ? `<br>${diffHtml({ actual: x.c.actual, sys: x.st.qty })}` : ' ✓'}${(dd => dd && Number(dd['已備貨']) ? `<br>地上 ${fmt(Number(dd['地上']))}＋備貨 ${fmt(Number(dd['已備貨']))}` : '')(detailOf(countWh, x.g.code))}` : '還沒盤'}</div>
      </button>`;
    }).join('') + (vis.length > countShown ? `<button class="more" id="countMore">再顯示 ${Math.min(80, vis.length - countShown)} 項（共 ${vis.length}）</button>` : '');
  $('countList').querySelectorAll('[data-cc]').forEach(b => b.onclick = () => openCount(b.dataset.cc));
  const m = $('countMore'); if (m) m.onclick = () => { countShown += 80; renderCount(); };
}
$('countQ').oninput = () => { countShown = 80; renderCount(); };
$('countReload').onclick = () => loadReports(true);
// 「結束這次盤點」放在電腦的上傳頁，手機上不顯示，避免誤按
let cdTarget = null;
function openCount(code) {
  const x = countItems().find(i => i.g.code === code); if (!x) return;
  cdTarget = x;
  $('cdName').textContent = x.g.name;
  $('cdCode').textContent = `${x.g.code}　${countWh} ${whLabel(countWh)}`;
  $('cdSys').innerHTML = `系統數量：<b>${fmt(x.st.qty)}</b>　<span style="color:var(--muted);font-size:13px">（${esc(data.date)} 報表）</span>`;
  const d = detailOf(countWh, x.g.code), auto = preparedTotal(x.g.code);
  if (d) { $('cdQty').value = d['地上']; $('cdPrep').value = d['已備貨'] || ''; }
  else { $('cdPrep').value = auto || ''; $('cdQty').value = x.c ? Math.max(0, x.c.actual - (auto || 0)) : ''; }   // 舊的盤點只有合計：扣掉已備貨當作地上
  $('cdPrepHint').textContent = auto ? `備料清單裡這項已備好 ${fmt(auto)}（還沒出貨），已自動帶入（可以改）` : '';
  $('cdClear').hidden = !x.c;
  cdLive();
  if (!$('countDlg').open) $('countDlg').showModal();
  $('cdQty').focus(); $('cdQty').select();
}
function cdTotal() {
  const a = parseFloat($('cdQty').value), b = parseFloat($('cdPrep').value);
  return isNaN(a) ? NaN : a + (isNaN(b) ? 0 : b);
}
function cdLive() {
  const v = cdTotal(), b = parseFloat($('cdPrep').value);
  if (!isNaN(v) && !isNaN(b) && b > 0 && cdTarget) {
    $('cdLive').innerHTML = `合計 <b>${fmt(v)}</b>　` + (v === cdTarget.st.qty ? '<span style="color:var(--good)">✓ 和系統一樣</span>' : `和系統相比：${diffHtml({ actual: v, sys: cdTarget.st.qty })}`);
    return;
  }
  $('cdLive').innerHTML = isNaN(v) || !cdTarget ? '' : v === cdTarget.st.qty ? '<span style="color:var(--good)">✓ 和系統一樣</span>' : `和系統相比：${diffHtml({ actual: v, sys: cdTarget.st.qty })}`;
}
$('cdQty').oninput = $('cdPrep').oninput = cdLive;
$('cdCancel').onclick = () => $('countDlg').close();
async function countAction(body, okMsg, optimistic) {
  const before = counts.slice();
  if (optimistic) { optimistic(); store.set('inv-counts-shared', counts); renderCount(); }
  try {
    const j = await repApi(body);
    applyShared(j);
    if (!countsOk) { toast('Google 那邊的程式還沒更新，盤點暫時不能用'); return; }
    if (okMsg) toast(okMsg);
  } catch (e) {
    counts = before; store.set('inv-counts-shared', counts); renderCount();
    toast(e.code ? e.message : '沒有網路，剛剛那筆沒有存到，請有訊號時再輸入一次');
  }
}
function saveCount(next) {
  const v = cdTotal(), x = cdTarget, floor = parseFloat($('cdQty').value), prep = parseFloat($('cdPrep').value) || 0;
  if (isNaN(v) || floor < 0 || prep < 0 || !x) { $('cdQty').focus(); return; }
  const d = detailOf(countWh, x.g.code);
  tPut('盤點明細', { ...(d ? { id: d.id } : {}), 倉別: countWh, 編號: x.g.code, 地上: floor, 已備貨: prep }).catch(() => {});
  const rec = { wh: countWh, code: x.g.code, name: x.g.name, sys: x.st.qty, actual: v, dataDate: data.date };
  countAction({ action: 'countSet', count: rec }, null, () => {
    counts = counts.filter(c => !(c.wh === countWh && c.code === x.g.code)).concat([{ ...rec, id: 'tmp', at: new Date().toISOString() }]);
  });
  if (next) {
    // 下一項：照目前清單順序，找後面還沒盤的
    const vis = countVisible(countItems()), i = vis.findIndex(y => y.g.code === x.g.code);
    const n = vis.slice(i + 1).find(y => !y.c) || vis.find(y => !y.c && y.g.code !== x.g.code);
    if (n) { openCount(n.g.code); return; }
    const left = countItems().filter(y => !y.c && y.g.code !== x.g.code).length;
    toast(left ? `這個清單盤完了，這個倉還有 ${left} 項沒盤` : '這個倉都盤完了 🎉');
  }
  $('countDlg').close();
}
$('cdSave').onclick = () => saveCount(false);
$('countForm').onsubmit = e => { e.preventDefault(); saveCount(true); };
$('cdClear').onclick = () => {
  const x = cdTarget; if (!x) return;
  $('countDlg').close();
  countAction({ action: 'countClear', wh: countWh, code: x.g.code }, '已清除這筆', () => { counts = counts.filter(c => !(c.wh === countWh && c.code === x.g.code)); });
};

/* ---------- 切換 ---------- */
function setTab(t) {
  tab = t;
  $('mainView').classList.toggle('counting', t === 'count');   // 盤點時，上面的搜尋框和倉別按鈕先收起來（盤點有自己的）
  [['search', 'tabSearch', 'searchView'], ['pick', 'tabPick', 'pickView'], ['rep', 'tabRep', 'repView'], ['count', 'tabCount', 'countView']].forEach(([k, b, v]) => {
    $(b).setAttribute('aria-selected', k === t); $(v).hidden = k !== t;
  });
  t === 'pick' ? renderPick() : t === 'rep' ? renderReports() : t === 'count' ? renderCount() : renderSearch();
}
$('tabSearch').onclick = () => setTab('search');
$('tabPick').onclick = () => { setTab('pick'); loadReports(true); };
$('tabRep').onclick = () => { setTab('rep'); loadReports(true); };
$('tabCount').onclick = () => { setTab('count'); loadReports(true); };
let qTimer;
$('q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { shown = PAGE; if (tab === 'search') renderSearch(); else setTab('search'); }, 120); };
$('clearQ').onclick = () => { $('q').value = ''; $('q').focus(); shown = PAGE; setTab('search'); };

function render() {
  $('emptyView').hidden = !!data;
  $('mainView').hidden = !data;
  $('footSync').hidden = !data;
  renderHeader();
  savePicks(); saveReports();
  if (!data) return;
  renderChips();
  setTab(tab);
}
function emptyState(which) {
  ['stLoading', 'stNone', 'stOffline'].forEach(id => $(id).hidden = id !== which);
}
const fmtTime = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

/* ---------- 同步：從網站抓電腦上傳的加密資料檔 ---------- */
let pending = null, syncing = false, lastSync = 0;
function askPass(msg) {
  $('passBox').hidden = false;
  $('passTitle').textContent = data ? '有新資料，需要密碼' : '輸入公司密碼';
  $('passMsg').textContent = msg || '庫存資料有加密。這支手機只要輸入一次，之後會記住。';
  if (!data) emptyState(null);
}
async function applyFile(file, pw) {
  const d = await decryptData(file, pw);
  const isUpdate = !!data && data.uploadedAt !== d.uploadedAt;
  data = d; pass = pw;
  if (!store.set('inv-data', data)) toast('這個瀏覽器不能儲存（例如無痕模式），關掉後要重新下載。');
  store.set('inv-pass', pass);
  index = null; shown = PAGE; pending = null; $('passBox').hidden = true;
  render();
  loadReports(true);
  if (isUpdate) toast(`已更新到 ${d.date} 的資料`);
}
async function sync(manual) {
  if (syncing) return; syncing = true; lastSync = Date.now();
  try {
    let file = null;
    try {
      file = (await fetchDataFile()).file;
    } catch (e) {
      if (!data) emptyState('stOffline'); else if (manual) toast('連不上網路，先用手機裡的資料');
      return;
    }
    if (!file) { if (!data) emptyState('stNone'); else if (manual) toast('還沒有人上傳資料'); return; }
    if (data && data.uploadedAt === file.uploadedAt) { if (manual) toast('已經是最新的資料'); return; }
    if (!pass) { pending = file; askPass(); return; }
    try { await applyFile(file, pass); }
    catch (e) {
      pending = file;
      askPass(e.badPassword ? (data ? '密碼可能換了，請輸入新密碼。在輸入之前，仍然顯示舊的資料。' : '') : '資料檔讀不出來：' + e.message);
    }
  } finally { syncing = false; }
}
$('passBox').onsubmit = async e => {
  e.preventDefault();
  const pw = $('passInput').value;
  if (!pw || !pending) return;
  try { await applyFile(pending, pw); $('passInput').value = ''; toast('密碼正確，已記住'); }
  catch (err) { $('passMsg').textContent = err.badPassword ? '密碼不對，請再試一次。' : '資料檔讀不出來：' + err.message; $('passInput').select(); }
};
document.querySelectorAll('[data-sync]').forEach(b => b.onclick = () => { if (!data) emptyState('stLoading'); sync(true); });
// 回到這個畫面時（例如從 LINE 切回來）自動檢查，最多 5 分鐘一次
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (Date.now() - lastSync > 300000) sync(false);
  loadReports(false);
});
$('uploadLink').textContent = new URL('upload.html', location.href).href;
$('uploadLink').href = 'upload.html';

render();
if (!data) emptyState('stLoading');
sync(false);
loadReports(true);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
