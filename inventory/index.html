<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16354d">
<title>庫存查詢</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#e9edf0; --surface:#ffffff; --sunk:#f3f5f7; --ink:#14212b; --muted:#5a6a76; --line:#cfd7dd;
  --accent:#f2a900; --accent-ink:#1a1400; --steel:#1f5f8b; --good:#1d7a4c; --warn:#a85b00; --bad:#b3261e;
  --hl:#fff1c2; --bar:#16354d; --bar-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#16212a; --sunk:#111b22; --ink:#e2e9ee; --muted:#8fa0ad; --line:#2a3a46;
  --accent:#f5b81f; --accent-ink:#1a1400; --steel:#6fa8d6; --good:#4fc48a; --warn:#f0a040; --bad:#f2786f;
  --hl:#3d3418; --bar:#0b1d2a; --bar-ink:#e2e9ee; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16212a; --sunk:#111b22; --ink:#e2e9ee; --muted:#8fa0ad; --line:#2a3a46;
  --accent:#f5b81f; --accent-ink:#1a1400; --steel:#6fa8d6; --good:#4fc48a; --warn:#f0a040; --bad:#f2786f;
  --hl:#3d3418; --bar:#0b1d2a; --bar-ink:#e2e9ee; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
header{background:var(--bar);color:var(--bar-ink);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.04em}
header .date{margin-left:auto;font-size:13px;opacity:.85;text-align:right;line-height:1.3}
header .date b{display:block;font-size:14px;opacity:1}

/* sticky search area */
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:52px;border:2px solid var(--line);border-radius:12px;background:var(--surface);
  padding:0 14px;font-size:18px}
.search input:focus{outline:none;border-color:var(--steel)}
.search .clear{width:52px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:#fff}
.chip.clear{border-color:var(--bad);color:var(--bad);background:transparent;font-weight:500}
.allnote{align-self:center;color:var(--muted);font-size:13px;padding:0 4px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{flex:1;border:none;border-radius:10px;padding:9px;background:var(--sunk);font-weight:500;font-size:15px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* banners */
.banner{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{border-color:var(--warn);background:var(--hl)}
.banner.bad{border-color:var(--bad)}
.banner b{font-weight:700}

/* result cards */
.meta{color:var(--muted);font-size:13px;margin:10px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.card .name{font-size:17px;font-weight:700;line-height:1.35;word-break:break-word}
.card .code{display:flex;align-items:center;gap:8px;margin-top:2px;color:var(--steel);font-size:15px;font-weight:600;word-break:break-all}
.card .wt{color:var(--muted);font-size:13px;flex:1}
.stock{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.srow{display:flex;align-items:center;gap:10px;padding:5px 0}
.wh{font-size:14px;min-width:0;flex:1}
.wh .no{display:inline-block;min-width:30px;text-align:center;border-radius:6px;background:var(--sunk);padding:0 6px;margin-right:6px;font-weight:700}
.wh.main .no{background:var(--steel);color:#fff}
.qty{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty.neg{color:var(--bad)}
.qty.zero{color:var(--muted)}
.qty small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.add{border:1.5px solid var(--steel);color:var(--steel);background:transparent;border-radius:8px;padding:3px 10px;font-size:14px;white-space:nowrap}
.add.on{background:var(--good);border-color:var(--good);color:#fff}
.negnote{font-size:12px;color:var(--bad)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.more{width:100%;border:1.5px dashed var(--steel);background:transparent;color:var(--steel);border-radius:12px;padding:10px;margin:6px 0 10px;font-size:15px}

/* pick list */
.pick{display:flex;gap:10px;align-items:flex-start}
.pick input[type=checkbox]{width:26px;height:26px;margin-top:2px;flex:none;accent-color:var(--good)}
.pick .body{flex:1;min-width:0}
.pick.done .name{text-decoration:line-through;color:var(--muted)}
.pick .need{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;flex-wrap:wrap}
.pick .need input{width:90px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--sunk);padding:0 8px;font-size:16px}
.pick .del{border:none;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{border:none;border-radius:10px;padding:10px 16px;background:var(--steel);color:#fff;font-weight:500}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* empty / import */
.empty{text-align:center;padding:28px 8px}
.empty h2{font-size:20px;margin:6px 0 8px}
.empty p{color:var(--muted);margin:6px 0}
.steps{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px 12px 34px;margin:16px auto;max-width:460px}
.steps li{margin:4px 0}
.big{font-size:18px;padding:14px 22px;border-radius:12px}
footer{color:var(--muted);font-size:13px;padding:20px 0 32px;border-top:1px solid var(--line);margin-top:24px}
footer a{color:var(--steel)}
footer .row{margin:8px 0}
footer .row.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* 數量回報 */
.srow .rep{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:2px 8px;font-size:13px;white-space:nowrap}
.repnote{font-size:13px;color:var(--warn);margin:-2px 0 4px 36px}
.diff{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.diff.d-less{color:var(--bad)} .diff.d-more{color:var(--warn)}
.rcard .line{font-size:15px;margin-top:4px}
.rcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
dialog{border:none;border-radius:16px;padding:0;width:min(520px,calc(100% - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:16px}
dialog h3{margin:0 0 2px;font-size:17px;line-height:1.35}
dialog .sys{background:var(--sunk);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:15px}
dialog label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
dialog input[type=number],dialog input[type=text]{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);padding:0 12px;font-size:18px}
dialog input:focus{outline:none;border-color:var(--steel)}
dialog .chips{margin-top:0}
dialog .live{font-size:14px;margin-top:6px;min-height:1.5em}
dialog .btnrow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast button{margin-left:10px;border:none;background:none;color:var(--accent);font-weight:700;padding:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>庫存查詢</h1>
  <div class="date" id="dateBox" hidden></div>
</div></header>

<main class="wrap">
  <section id="emptyView" class="empty" hidden>
    <div id="stLoading"><h2>讀取資料中…</h2></div>
    <div id="stNone" hidden>
      <h2>還沒有庫存資料</h2>
      <p>請用<b>電腦</b>打開上傳頁面，上傳 ERP 的庫存報表：</p>
      <p class="mono" style="word-break:break-all"><a id="uploadLink" href="upload.html">upload.html</a></p>
      <p>上傳後大約 1～2 分鐘，這裡就會自動出現。</p>
      <button class="btn" data-sync>重新檢查</button>
    </div>
    <div id="stOffline" hidden>
      <h2>連不上網路</h2>
      <p>第一次使用要有網路，才能下載庫存資料。之後沒網路也能查。</p>
      <button class="btn" data-sync>再試一次</button>
    </div>
  </section>

  <form id="passBox" class="banner" hidden>
    <b id="passTitle">輸入公司密碼</b>
    <p id="passMsg" style="margin:4px 0 10px">庫存資料有加密。這支手機只要輸入一次，之後會記住。</p>
    <div class="search">
      <input id="passInput" type="password" autocomplete="current-password" placeholder="密碼" required>
      <button class="btn primary" type="submit" style="padding:0 18px">確定</button>
    </div>
  </form>

  <section id="mainView" hidden>
    <div class="sticky">
      <div class="search">
        <input id="q" type="text" inputmode="search" autocomplete="off" enterkeyhint="search"
          placeholder="打品名或編號，例如：斜桿 1.8">
        <button class="clear" id="clearQ" aria-label="清除">×</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabSearch" aria-selected="true">查詢</button>
        <button class="tab" role="tab" id="tabPick" aria-selected="false">備料清單 <span id="pickCount"></span></button>
        <button class="tab" role="tab" id="tabRep" aria-selected="false">回報 <span id="repCount"></span></button>
      </div>
    </div>
    <div id="staleBox"></div>
    <div id="searchView"></div>
    <div id="pickView" hidden></div>
    <div id="repView" hidden></div>
  </section>

  <footer>
    <div class="row btns" id="footSync">
      <button class="btn ghost" data-sync>檢查有沒有新資料</button>
      <span id="fileInfo"></span>
    </div>
    <div class="row">數量來自電腦上傳的 ERP 報表，<b>不是即時庫存</b>。負數表示帳上數量不對，請以現場為準。</div>
    <div class="row">新的報表請用電腦上傳：<a href="upload.html">上傳頁面</a></div>
    <div class="row"><a href="../">← 貨櫃裝箱模擬</a></div>
  </footer>
</main>
<div class="toast" id="toast" hidden></div>
<dialog id="repDlg">
  <form method="dialog" id="repForm">
    <h3 id="repName"></h3>
    <div class="mono" style="color:var(--steel);font-size:14px" id="repCode"></div>
    <div class="sys" id="repSys"></div>
    <label class="f" for="repQty">現場實際數量</label>
    <input id="repQty" type="number" inputmode="numeric" step="any" required placeholder="點到幾個？">
    <div class="live" id="repLive"></div>
    <label class="f">可能原因</label>
    <div class="chips" id="repReason"></div>
    <label class="f" for="repNote">備註（選填）</label>
    <input id="repNote" type="text" placeholder="例如：A 區架上只有 3 包">
    <div class="btnrow">
      <button class="btn ghost" type="button" id="repCancel">取消</button>
      <button class="btn primary" type="submit">送出</button>
    </div>
  </form>
</dialog>

<script src="common.js"></script>
<script src="config.js"></script>
<script>
'use strict';
const MAIN_WH = ['02', '06'];          // 倉管常用：02 新品倉、06 五金倉（第一次打開預設選這兩個）
const WH_ORDER = ['01', '02', '03', '06', '04'];   // 倉別按鈕與卡片裡的排列順序；其他倉排在後面
const whRank = w => { const i = WH_ORDER.indexOf(w); return i < 0 ? WH_ORDER.length : i; };
const whCmp = (a, b) => (whRank(a) - whRank(b)) || a.localeCompare(b);
const PAGE = 60;                        // 一次顯示幾張卡片
const $ = id => document.getElementById(id);

/* ---------- 儲存（只在這個瀏覽器） ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
let data = store.get('inv-data', null);     // {date, dateSource, file, uploadedAt, wh:{code:name}, rows:[[wh,code,name,qty,wt]]}
let pass = store.get('inv-pass', null);     // 公司密碼（只存在這支手機）
let pick = store.get('inv-pick', []);       // [{code, name, need, done}]
let reports = store.get('inv-reports-shared', []); // 共用回報（未處理的），先用上次抓到的顯示：[{id, code, name, wh, sys, actual, reason, note, at, dataDate}]
const repState = { loading: false, error: '', at: 0 };
let tab = 'search';
let whSel = store.get('inv-wh', null);      // 選了哪些倉；null = 預設
let shown = PAGE;

/* ---------- 工具 ---------- */
function toast(msg, action, fn) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  if (action) {
    const b = document.createElement('button'); b.textContent = action;
    b.onclick = () => { t.hidden = true; fn(); }; t.appendChild(b);
  }
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, action ? 5000 : 2600);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 搜尋用：全形轉半形、大小寫、×→x、去空白
const norm = s => String(s).normalize('NFKC').toLowerCase().replace(/[×*＊]/g, 'x').replace(/[Φø]/g, 'φ').replace(/\s+/g, '');
const fmt = n => n == null ? '' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
function daysAgo(iso) {
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00'); const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((now - d) / 86400000);
}

/* ---------- 畫面 ---------- */
function whList() {
  const s = new Set(data.rows.map(r => r[0]));
  return [...s].sort(whCmp);
}
// 使用者點選的倉（可以一個都沒選）；第一次打開預設 02、06
function pickedWh() {
  const all = whList();
  return (whSel || MAIN_WH).filter(w => all.includes(w));
}
// 實際要查的倉：沒選任何倉 = 全部倉
function selectedWh() {
  const p = pickedWh();
  return p.length ? p : whList();
}
function whLabel(w) { return (data.wh && data.wh[w]) || ''; }

function renderHeader() {
  const box = $('dateBox');
  if (!data) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<b>${esc(data.date)}</b>${esc(data.dateSource)}`;
  $('fileInfo').textContent = `目前：${data.rows.length} 筆，${fmtTime(data.uploadedAt)} 上傳`;
  const d = daysAgo(data.date);
  $('staleBox').innerHTML = d != null && d >= 7
    ? `<div class="banner warn"><b>資料是 ${d} 天前的。</b>數量可能已經變了，有空請匯入新的報表。</div>` : '';
}
function renderChips() {
  const all = whList(), picked = pickedWh();
  $('chips').innerHTML = all.map(w =>
    `<button class="chip" data-wh="${esc(w)}" aria-pressed="${picked.includes(w)}">${esc(w)} ${esc(whLabel(w))}</button>`).join('')
    + (picked.length
      ? `<button class="chip clear" data-wh="-">✕ 清除</button>`
      : `<span class="allnote">沒選＝查全部倉</span>`);
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const w = b.dataset.wh;
    if (w === '-') whSel = [];
    else {
      const s = new Set(picked);
      s.has(w) ? s.delete(w) : s.add(w);
      whSel = [...s];
    }
    store.set('inv-wh', whSel); shown = PAGE; renderChips(); renderSearch();
  });
}

let index = null;
function buildIndex() {
  // 同一個編號在不同倉的資料合在一張卡片
  const byCode = new Map();
  for (const [wh, code, name, qty, wt] of data.rows) {
    let g = byCode.get(code);
    if (!g) { g = { code, name, wt, stock: [], hay: '' }; byCode.set(code, g); }
    if (name.length > g.name.length) g.name = name;
    if (g.wt == null) g.wt = wt;
    g.stock.push({ wh, qty });
  }
  for (const g of byCode.values()) {
    g.hay = norm(g.code + ' ' + g.name); g.ncode = norm(g.code);
    g.stock.sort((a, b) => whCmp(a.wh, b.wh));
  }
  index = { data, groups: [...byCode.values()].sort((a, b) => a.code.localeCompare(b.code)) };
}
function highlight(text, tokens) {
  // 在原文上標出符合的字（忽略空白差異只做簡單比對）
  let out = esc(text);
  for (const t of tokens) {
    if (!t) continue;
    const re = new RegExp(t.split('').map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s*'), 'gi');
    out = out.replace(re, m => `<mark>${m}</mark>`);
  }
  return out;
}
function inPick(code) { return pick.some(p => p.code === code); }

function cardHtml(g, sel, tokens) {
  const rows = g.stock.filter(s => sel.includes(s.wh));
  const neg = rows.some(s => s.qty < 0);
  return `<article class="card">
    <div class="name">${highlight(g.name, tokens)}</div>
    <div class="code mono">${highlight(g.code, tokens)}</div>
    <div class="stock">${rows.map(s => `
      <div class="srow">
        <div class="wh ${MAIN_WH.includes(s.wh) ? 'main' : ''}"><span class="no mono">${esc(s.wh)}</span>${esc(whLabel(s.wh))}</div>
        <div class="qty ${s.qty < 0 ? 'neg' : s.qty === 0 ? 'zero' : ''}">${fmt(s.qty)}<small>支/個</small></div>
        ${REPORT_API ? `<button class="rep" data-rep="${esc(g.code)}" data-wh="${esc(s.wh)}">回報</button>` : ''}
      </div>${repNoteHtml(g.code, s.wh)}`).join('')}
      ${neg ? '<div class="negnote">帳上是負數，實際數量請以現場為準。</div>' : ''}
      <div class="srow">
        <span class="wt">${g.wt != null ? `單重 ${fmt(g.wt)} kg` : ''}</span>
        <button class="add ${inPick(g.code) ? 'on' : ''}" data-add="${esc(g.code)}">${inPick(g.code) ? '✓ 已在備料清單' : '＋ 加入備料'}</button>
      </div>
    </div>
  </article>`;
}

function renderSearch() {
  if (!index || index.data !== data) buildIndex();
  const raw = $('q').value.trim();
  const tokens = raw ? raw.split(/\s+/).map(norm).filter(Boolean) : [];
  const sel = selectedWh();
  const view = $('searchView');
  if (!tokens.length) {
    const n = index.groups.filter(g => g.stock.some(s => sel.includes(s.wh))).length;
    view.innerHTML = `<p class="meta">${pickedWh().length ? '目前選的倉' : '全部倉'}共有 ${n} 種品項。在上面打品名或編號開始找；可以打好幾段，用空白分開，例如「斜桿 1.8」「SB-BD」「螺絲 M6」。</p>`;
    return;
  }
  const hit = index.groups.filter(g => tokens.every(t => g.hay.includes(t)));
  const inSel = hit.filter(g => g.stock.some(s => sel.includes(s.wh)));
  const outside = hit.length - inSel.length;
  const q0 = tokens.join('');
  inSel.sort((a, b) => ((b.ncode === q0) - (a.ncode === q0)) || ((b.ncode.startsWith(q0)) - (a.ncode.startsWith(q0))) || a.code.localeCompare(b.code));
  let html = `<p class="meta">找到 ${inSel.length} 種${outside ? `，其他倉還有 ${outside} 種` : ''}</p>`;
  if (!inSel.length) {
    html = `<div class="banner">${outside
      ? `目前選的倉沒有，但<b>其他倉有 ${outside} 種</b>。<br><button class="btn" id="showAll" style="margin-top:8px">看全部倉</button>`
      : '找不到。試試看少打幾個字，或只打編號的一部分。'}</div>`;
  }
  html += inSel.slice(0, shown).map(g => cardHtml(g, sel, tokens)).join('');
  if (inSel.length > shown) html += `<button class="more" id="more">再顯示 ${Math.min(PAGE, inSel.length - shown)} 筆（共 ${inSel.length}）</button>`;
  else if (outside && inSel.length) html += `<button class="more" id="showAll">其他倉還有 ${outside} 種，看全部倉</button>`;
  view.innerHTML = html;
  const more = $('more'); if (more) more.onclick = () => { shown += PAGE; renderSearch(); };
  const sa = $('showAll'); if (sa) sa.onclick = () => { whSel = []; store.set('inv-wh', whSel); renderChips(); renderSearch(); };
  view.querySelectorAll('[data-add]').forEach(b => b.onclick = () => togglePick(b.dataset.add));
  view.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => openReport(b.dataset.rep, b.dataset.wh));
}

/* ---------- 備料清單 ---------- */
function savePick() { store.set('inv-pick', pick); $('pickCount').textContent = pick.length ? `(${pick.length})` : ''; }
function togglePick(code) {
  const i = pick.findIndex(p => p.code === code);
  if (i >= 0) pick.splice(i, 1);
  else { const g = index.groups.find(x => x.code === code); pick.push({ code, name: g ? g.name : '', need: '', done: false }); toast('已加入備料清單'); }
  savePick(); renderSearch();
}
function stockText(code) {
  const g = index.groups.find(x => x.code === code);
  if (!g) return '（目前報表裡沒有這個編號）';
  return g.stock.map(s => `${s.wh}${whLabel(s.wh)} ${fmt(s.qty)}`).join('、');
}
function renderPick() {
  if (!index || index.data !== data) buildIndex();
  const v = $('pickView');
  if (!pick.length) {
    v.innerHTML = `<div class="banner">備料清單是空的。在「查詢」找到東西後，按「＋ 加入備料」。</div>`;
    return;
  }
  const done = pick.filter(p => p.done).length;
  v.innerHTML = `<p class="meta">共 ${pick.length} 項，已備好 ${done} 項</p>` + pick.map((p, i) => `
    <article class="card pick ${p.done ? 'done' : ''}">
      <input type="checkbox" data-done="${i}" ${p.done ? 'checked' : ''} aria-label="備好了">
      <div class="body">
        <div class="name">${esc(p.name)}</div>
        <div class="code mono">${esc(p.code)}</div>
        <div class="meta" style="margin:4px 0 0">庫存：${esc(stockText(p.code))}</div>
        <label class="need">要備 <input type="number" inputmode="numeric" min="0" data-need="${i}" value="${esc(p.need)}"> 支/個</label>
      </div>
      <button class="del" data-del="${i}" aria-label="移除">×</button>
    </article>`).join('') + `
    <div class="actions">
      <button class="btn primary" id="copyPick">複製清單（貼到 LINE）</button>
      <button class="btn ghost" id="clearDone">移除已備好的</button>
      <button class="btn ghost" id="clearPick">全部清空</button>
    </div>`;
  v.querySelectorAll('[data-done]').forEach(c => c.onchange = () => { pick[c.dataset.done].done = c.checked; savePick(); renderPick(); });
  v.querySelectorAll('[data-need]').forEach(c => c.oninput = () => { pick[c.dataset.need].need = c.value; savePick(); });
  v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { pick.splice(b.dataset.del, 1); savePick(); renderPick(); });
  $('clearDone').onclick = () => { pick = pick.filter(p => !p.done); savePick(); renderPick(); };
  $('clearPick').onclick = () => { if (confirm('確定清空備料清單？')) { pick = []; savePick(); renderPick(); } };
  $('copyPick').onclick = async () => {
    const lines = pick.map((p, i) => `${i + 1}. ${p.done ? '✅' : '⬜'} ${p.name}\n   ${p.code}${p.need ? `　要備 ${p.need}` : ''}\n   庫存：${stockText(p.code)}`);
    const text = `備料清單（庫存資料 ${data.date}）\n` + lines.join('\n');
    try { await navigator.clipboard.writeText(text); toast('已複製，可以貼到 LINE'); }
    catch (e) { prompt('請長按複製：', text); }
  };
}

/* ---------- 數量回報（大家共用，存在 Google 試算表） ---------- */
const REASONS = ['備貨拿走', '帳錯了'];
function saveReports() {
  store.set('inv-reports-shared', reports);
  $('repCount').textContent = reports.length ? `(${reports.length})` : '';
  $('tabRep').hidden = !REPORT_API;
}
async function repApi(body) {
  const r = await fetch(REPORT_API, { method: 'POST', body: JSON.stringify({ ...body, pass }) });
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error === 'badpass' ? '回報的密碼和試算表裡的不一樣' : (j.error || '回報失敗')); e.code = j.error; throw e; }
  return j.reports || [];
}
function setReports(list) {
  reports = list; repState.error = ''; repState.at = Date.now(); saveReports();
  if (tab === 'search') renderSearch(); else if (tab === 'rep') renderReports();
}
async function loadReports(force) {
  if (!REPORT_API || !pass || repState.loading) return;
  if (!force && Date.now() - repState.at < 60000) return;   // 一分鐘內不重抓
  repState.loading = true; if (tab === 'rep') renderReports();
  try { setReports(await repApi({ action: 'list' })); }
  catch (e) { repState.error = e.code ? e.message : '連不上網路，顯示上次的回報'; }
  finally { repState.loading = false; if (tab === 'rep') renderReports(); }
}
function diffHtml(r) {
  const d = r.actual - r.sys;
  if (d === 0) return '<span class="diff">一樣</span>';
  return `<span class="diff ${d < 0 ? 'd-less' : 'd-more'}">${d < 0 ? '少' : '多'} ${fmt(Math.abs(d))}</span>`;
}
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function repNoteHtml(code, wh) {
  const r = reports.filter(x => x.code === code && x.wh === wh).pop();
  return r ? `<div class="repnote">⚠ 有人回報：實際 ${fmt(r.actual)}（${diffHtml(r)}，${when(r.at)}）</div>` : '';
}
let repTarget = null, repReason = REASONS[0], repSending = false;
function openReport(code, wh) {
  const g = index.groups.find(x => x.code === code); if (!g) return;
  const st = g.stock.find(s => s.wh === wh); if (!st) return;
  repTarget = { code, name: g.name, wh, sys: st.qty };
  $('repName').textContent = g.name;
  $('repCode').textContent = `${code}　${wh} ${whLabel(wh)}`;
  $('repSys').innerHTML = `系統數量：<b>${fmt(st.qty)}</b>　<span style="color:var(--muted);font-size:13px">（${esc(data.date)} 報表）</span>`;
  $('repQty').value = ''; $('repNote').value = ''; $('repLive').textContent = '';
  repReason = REASONS[0]; renderReasons();
  $('repDlg').showModal();
  setTimeout(() => $('repQty').focus(), 50);
}
function renderReasons() {
  $('repReason').innerHTML = REASONS.map(r => `<button type="button" class="chip" aria-pressed="${r === repReason}" data-r="${r}">${r}</button>`).join('');
  $('repReason').querySelectorAll('.chip').forEach(b => b.onclick = () => { repReason = b.dataset.r; renderReasons(); });
}
$('repQty').oninput = () => {
  const v = parseFloat($('repQty').value);
  $('repLive').innerHTML = isNaN(v) || !repTarget ? '' : `和系統相比：${diffHtml({ actual: v, sys: repTarget.sys })}`;
};
$('repCancel').onclick = () => $('repDlg').close();
$('repForm').onsubmit = async e => {
  e.preventDefault();
  const v = parseFloat($('repQty').value);
  if (isNaN(v) || !repTarget) { $('repQty').focus(); return; }
  if (repSending) return;
  repSending = true;
  const btn = $('repForm').querySelector('[type=submit]'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    setReports(await repApi({ action: 'add', report: { ...repTarget, actual: v, reason: repReason, note: $('repNote').value.trim(), dataDate: data.date } }));
    $('repDlg').close(); toast('已送出，大家都看得到了');
  } catch (err) {
    $('repLive').innerHTML = `<span style="color:var(--bad)">${esc(err.code ? err.message : '沒有送出：連不上網路，請有訊號時再按一次。')}</span>`;
  } finally { repSending = false; btn.disabled = false; btn.textContent = '送出'; }
};
async function markDone(id, undo) {
  const i = reports.findIndex(r => r.id === id);
  const gone = i >= 0 ? reports[i] : null;
  if (!undo && gone) { reports.splice(i, 1); saveReports(); renderReports(); }   // 先劃掉，畫面不用等
  try {
    setReports(await repApi({ action: undo ? 'reopen' : 'done', id }));
    if (!undo) toast('已劃掉', '復原', () => markDone(id, true));
  } catch (e) {
    if (!undo && gone) { reports.splice(i, 0, gone); saveReports(); renderReports(); }
    toast(e.code ? e.message : '沒有網路，沒有劃掉，請等一下再試');
  }
}
function renderReports() {
  if (!index || index.data !== data) buildIndex();
  const v = $('repView');
  const status = repState.loading ? '更新中…' : repState.error ? `<span style="color:var(--bad)">${esc(repState.error)}</span>` : repState.at ? `${when(new Date(repState.at).toISOString())} 更新` : '';
  const head = `<div class="meta" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span style="flex:1">大家的回報，處理完按 ✕ 劃掉。${status ? '・' + status : ''}</span>
      <button class="btn ghost" id="repReload" style="padding:6px 12px">重新整理</button></div>`;
  if (!reports.length) {
    v.innerHTML = head + `<div class="banner">${repState.loading && !repState.at ? '讀取中…' : '目前沒有回報。查詢時發現數量不對，在那個倉的數量旁邊按「回報」。'}</div>`;
  } else {
    const list = reports.slice().reverse();
    v.innerHTML = head + list.map(r => `
    <article class="card pick rcard">
      <div class="body">
        <div class="name">${esc(r.name)}</div>
        <div class="code mono">${esc(r.code)}</div>
        <div class="sub">${esc(r.wh)} ${esc(whLabel(r.wh))}</div>
        <div class="line">系統 ${fmt(r.sys)} → 實際 <b>${fmt(r.actual)}</b>（${diffHtml(r)}）</div>
        <div class="sub">原因：${esc(r.reason)}${r.note ? `　備註：${esc(r.note)}` : ''}</div>
        <div class="sub">${when(r.at)} 回報・對照 ${esc(r.dataDate)} 報表</div>
      </div>
      <button class="del" data-rdel="${esc(r.id)}" aria-label="處理完，劃掉">✕</button>
    </article>`).join('') + `
    <div class="actions"><button class="btn primary" id="copyRep">複製全部（貼到 LINE）</button></div>`;
    v.querySelectorAll('[data-rdel]').forEach(b => b.onclick = () => markDone(b.dataset.rdel));
    $('copyRep').onclick = async () => {
      const lines = list.map((r, i) => `${i + 1}. ${r.name}\n   ${r.code}　${r.wh}${whLabel(r.wh)}\n   系統 ${fmt(r.sys)} → 實際 ${fmt(r.actual)}（${r.actual - r.sys < 0 ? '少' : '多'} ${fmt(Math.abs(r.actual - r.sys))}）\n   原因：${r.reason}${r.note ? `，${r.note}` : ''}（${when(r.at)}）`);
      const text = `庫存數量回報（對照 ${data.date} 報表）\n` + lines.join('\n');
      try { await navigator.clipboard.writeText(text); toast('已複製，可以貼到 LINE'); }
      catch (e) { prompt('請長按複製：', text); }
    };
  }
  $('repReload').onclick = () => loadReports(true);
}

/* ---------- 切換 ---------- */
function setTab(t) {
  tab = t;
  [['search', 'tabSearch', 'searchView'], ['pick', 'tabPick', 'pickView'], ['rep', 'tabRep', 'repView']].forEach(([k, b, v]) => {
    $(b).setAttribute('aria-selected', k === t); $(v).hidden = k !== t;
  });
  t === 'pick' ? renderPick() : t === 'rep' ? renderReports() : renderSearch();
}
$('tabSearch').onclick = () => setTab('search');
$('tabPick').onclick = () => setTab('pick');
$('tabRep').onclick = () => { setTab('rep'); loadReports(true); };
let qTimer;
$('q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { shown = PAGE; if (tab === 'search') renderSearch(); else setTab('search'); }, 120); };
$('clearQ').onclick = () => { $('q').value = ''; $('q').focus(); shown = PAGE; setTab('search'); };

function render() {
  $('emptyView').hidden = !!data;
  $('mainView').hidden = !data;
  $('footSync').hidden = !data;
  renderHeader();
  savePick(); saveReports();
  if (!data) return;
  renderChips();
  setTab(tab);
}
function emptyState(which) {
  ['stLoading', 'stNone', 'stOffline'].forEach(id => $(id).hidden = id !== which);
}
const fmtTime = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? iso : `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

/* ---------- 同步：從網站抓電腦上傳的加密資料檔 ---------- */
let pending = null, syncing = false, lastSync = 0;
function askPass(msg) {
  $('passBox').hidden = false;
  $('passTitle').textContent = data ? '有新資料，需要密碼' : '輸入公司密碼';
  $('passMsg').textContent = msg || '庫存資料有加密。這支手機只要輸入一次，之後會記住。';
  if (!data) emptyState(null);
}
async function applyFile(file, pw) {
  const d = await decryptData(file, pw);
  const isUpdate = !!data && data.date !== d.date;
  data = d; pass = pw;
  if (!store.set('inv-data', data)) toast('這個瀏覽器不能儲存（例如無痕模式），關掉後要重新下載。');
  store.set('inv-pass', pass);
  index = null; shown = PAGE; pending = null; $('passBox').hidden = true;
  render();
  loadReports(true);
  if (isUpdate) toast(`已更新到 ${d.date} 的資料`);
}
async function sync(manual) {
  if (syncing) return; syncing = true; lastSync = Date.now();
  try {
    let file = null;
    try {
      const r = await fetch(`${DATA_FILE}?t=${Date.now()}`, { cache: 'no-store' });
      if (r.ok) file = await r.json();
      else if (r.status !== 404) throw new Error(r.status);
    } catch (e) {
      if (!data) emptyState('stOffline'); else if (manual) toast('連不上網路，先用手機裡的資料');
      return;
    }
    if (!file) { if (!data) emptyState('stNone'); else if (manual) toast('網站上沒有資料檔'); return; }
    if (data && data.uploadedAt === file.uploadedAt) { if (manual) toast('已經是最新的資料'); return; }
    if (!pass) { pending = file; askPass(); return; }
    try { await applyFile(file, pass); if (manual && data.uploadedAt === file.uploadedAt) toast('已經是最新的資料'); }
    catch (e) {
      pending = file;
      askPass(e.badPassword ? (data ? '密碼可能換了，請輸入新密碼。在輸入之前，仍然顯示舊的資料。' : '') : '資料檔讀不出來：' + e.message);
    }
  } finally { syncing = false; }
}
$('passBox').onsubmit = async e => {
  e.preventDefault();
  const pw = $('passInput').value;
  if (!pw || !pending) return;
  try { await applyFile(pending, pw); $('passInput').value = ''; toast('密碼正確，已記住'); }
  catch (err) { $('passMsg').textContent = err.badPassword ? '密碼不對，請再試一次。' : '資料檔讀不出來：' + err.message; $('passInput').select(); }
};
document.querySelectorAll('[data-sync]').forEach(b => b.onclick = () => { if (!data) emptyState('stLoading'); sync(true); });
// 回到這個畫面時（例如從 LINE 切回來）自動檢查，最多 5 分鐘一次
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (Date.now() - lastSync > 300000) sync(false);
  loadReports(false);
});
$('uploadLink').textContent = new URL('upload.html', location.href).href;
$('uploadLink').href = 'upload.html';

render();
if (!data) emptyState('stLoading');
sync(false);
loadReports(true);

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
